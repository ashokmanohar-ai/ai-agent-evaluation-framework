name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVAL_MODEL_PROVIDER: mock
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: MyPy
        run: mypy src tests
      - name: Tests
        run: pytest
      - name: Mock smoke evaluation and safety gate
        run: >-
          agent-eval run
          --dataset datasets/support/support-v1.jsonl
          --agent mock
          --tag smoke
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evaluation-reports
          path: reports/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-agent-evaluation-framework:${{ github.sha }} .
      - name: Run offline evaluation in image
        run: docker run --rm ai-agent-evaluation-framework:${{ github.sha }}
