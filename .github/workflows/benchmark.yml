name: Controlled benchmark

on:
  workflow_dispatch:
    inputs:
      candidate_a:
        description: Candidate A label/version
        required: true
        default: mock-v1
      candidate_b:
        description: Candidate B label/version
        required: true
        default: mock-v1-repeat
      runs_per_case:
        description: Repetitions per case
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVAL_MODEL_PROVIDER: mock
      OTEL_SDK_DISABLED: "true"
    strategy:
      matrix:
        candidate: [a, b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run identical benchmark dataset
        run: >-
          agent-eval run
          --dataset datasets/support/support-v1.jsonl
          --dataset datasets/tool-use/tool-use-v1.jsonl
          --runs-per-case '${{ inputs.runs_per_case }}'
          --report-dir 'reports/${{ matrix.candidate }}'
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.candidate }}
          path: reports/${{ matrix.candidate }}/
